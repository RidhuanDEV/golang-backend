name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
          POSTGRES_DB: backend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backend -d backend"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://backend:backend@localhost:5432/backend?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_secret_that_is_at_least_32_chars_long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - run: git diff --exit-code -- internal/db/sqlc
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run ./cmd/migrate
      - run: go run ./cmd/seed
      - run: go run ./cmd/migrate
      - run: go run ./cmd/initproject --no-install ../smoke-api < scripts/initproject-smoke-input.txt
      - run: cd ../smoke-api && go test ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
      - run: docker build -t modular-golang:ci .
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - shell: pwsh
        run: Get-Content scripts/initproject-smoke-input.txt | go run ./cmd/initproject --no-install ../smoke-api
      - run: go test ./...
        working-directory: ../smoke-api
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      APP_PORT: "3101"
      POSTGRES_PORT: "55433"
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d app
      - run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3101/ready
      - run: docker compose --profile redis --profile minio up -d redis minio
      - run: docker compose --profile redis --profile minio run --rm minio-init
      - run: |
          sed -i 's/^CACHE_ENABLED=false$/CACHE_ENABLED=true/' .env
          sed -i 's/^RATE_LIMIT_STORE=memory$/RATE_LIMIT_STORE=redis/' .env
          sed -i 's/^UPLOAD_STORAGE=local$/UPLOAD_STORAGE=s3/' .env
          docker compose --profile redis --profile minio up -d --force-recreate app
          docker compose --profile redis --profile minio run --rm --entrypoint seed app
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3101/ready
          token=$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"admin@example.com","password":"replace_this_password"}' http://127.0.0.1:3101/api/auth/login | jq -r '.data.token')
          test -n "$token"
          printf '\211PNG\r\n\032\n' > /tmp/sample.png
          curl --fail --silent --show-error -H "Authorization: Bearer $token" -F file=@/tmp/sample.png http://127.0.0.1:3101/api/upload | jq -e '.data.mimeType == "image/png"'
      - if: always()
        run: docker compose --profile redis --profile minio down --volumes --remove-orphans
